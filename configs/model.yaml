# Model and evaluation settings. Secrets go in .env, not here.
backend: hcx             # hcx | mock (mock runs are pre-tests and never go to eval-history)
prompt_version: baseline-v1
serialization: long      # long (one value per row) | wide (periods as columns); see kosis_chat/data/serializer.py

# HCX (HyperCLOVA X) via CLOVA Studio v3 chat-completions. Key: HCX_API_KEY in .env.
# Models: HCX-DASH-002 (light, current tuning model), HCX-007 (reasoning, paused since 10/22).
# thinking_effort (none | low | medium | high) is sent to HCX-007 only; its thinking tokens count
# toward max_tokens, so use about 5120 when it is not none.
model:
  name: HCX-DASH-002
  thinking_effort: none
  temperature: 0
  max_tokens: 1024
  max_input_tokens: null # input token limit checked before calling; null = not checked
  timeout_seconds: 60
  base_url: https://clovastudio.stream.ntruss.com
  api_key_env: HCX_API_KEY

mock:
  response: "[mock] 표에 있는 값만으로 답변합니다. 출처: KOSIS"

eval:
  runs: 1                # runs per question; keep fixed across B0..B4
